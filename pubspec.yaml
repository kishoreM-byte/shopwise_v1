name: shopwise_v1
description: "ShopWise V1 - Smart Shopping Comparison Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6

  # Authentication
  google_sign_in: ^7.2.0


  # State & Storage
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

  # UI / Images
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.5.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  geolocator: ^14.0.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  http: ^1.6.0
  geocoding: ^5.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/shopwise_logo.png

# App icon configuration MUST be outside flutter:
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/shopwise_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/shopwise_logo.png"